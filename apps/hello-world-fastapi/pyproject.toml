[project]
name = "hello-world-fastapi"
version = "0.1.0"
description = "A basic FastAPI application with ruff linter and formatter"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.109.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hello_world_fastapi"]